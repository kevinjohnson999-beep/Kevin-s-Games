<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f6b4d" />
    <meta name="description" content="Kevin's Games is a phone-friendly game platform for friends." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kevin's Games" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Kevin's Games</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="homeView" class="panel">
        <div class="mark" aria-hidden="true">KG</div>
        <h1>Kevin's Games</h1>
        <p>Choose a game, challenge friends, and play from any phone.</p>
        <div class="game-list">
          <button id="ticTacToeBtn" type="button" class="game-card">
            <strong>Tic-Tac-Toe</strong>
            <span>Quick two-player game</span>
          </button>
          <button type="button" class="game-card disabled" disabled>
            <strong>Dominoes</strong>
            <span>Being rebuilt</span>
          </button>
        </div>
      </section>

      <section id="ticTacToeView" class="panel game-panel hidden">
        <div class="game-head">
          <div>
            <p class="kicker">Tic-Tac-Toe</p>
            <h1 id="gameStatus">X goes first</h1>
          </div>
          <button id="backBtn" type="button" class="ghost-btn">Back</button>
        </div>
        <div id="board" class="board" aria-label="Tic-Tac-Toe board"></div>
        <div class="actions">
          <button id="resetBtn" type="button">New round</button>
        </div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
